<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>단꿈e 사은품 신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== 색상 토큰 ===== */
    :root {
      --hero-1: #2f3860; --hero-2: #232a46; --hero-3: #1b2138;
      --hero-fg: #ffffff; --hero-sub: rgba(255,255,255,.88); --hero-deco: #ffffff; --hero-dot: #ffffff;
      --script-c: #f28b78; --accent-c: #f4c64a;
      --hill-1: #cfe2d8; --foot-bar: #232a46;
      --navy: #232a46;
      --navy-2: #2d3557;
      --navy-dark: #1b2138;
      --coral: #f28b78;
      --mint-bg: #e9f1ed;
      --mint: #d5e6dc;
      --mint-line: #b9d3c3;
      --green: #3f7a5a;
      --red: #c9282f;
      --gold: #f4c64a;
      --snow: #ffffff;
      --text: #2a2f3a;
      --muted: #6d7584;
    }

    body {
      font-family: "Paperlogy", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, "Noto Sans KR", sans-serif;
      background: var(--mint-bg);
      color: var(--text);
      line-height: 1.45;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; }

    /* ===================== 헤더 (밤하늘) ===================== */
    .hero {
      position: relative; overflow: hidden;
      background: radial-gradient(120% 90% at 50% 0%, var(--hero-1) 0%, var(--hero-2) 55%, var(--hero-3) 100%);
      padding: clamp(38px,5vw,64px) 20px clamp(120px,14vw,190px);
      text-align: center; color: var(--hero-fg);
    }
    .sky-dots { position: absolute; inset: 0; pointer-events: none; }
    .hang { position: absolute; top: 0; width: 2px; background: var(--hero-deco); opacity: .75; pointer-events: none; transform-origin: 50% 0; animation: swing 5s ease-in-out infinite; }
    .hang svg { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); width: 24px; height: 24px; }
    .sleigh { color: var(--hero-deco); position: absolute; top: clamp(30px,4vw,54px); left: clamp(12px,5vw,70px); width: clamp(90px,12vw,150px); pointer-events: none; animation: fly 6s ease-in-out infinite; }

    .hero-inner { position: relative; z-index: 2; max-width: 760px; margin: 0 auto; }
    .logo { display: block; margin: 0 auto clamp(10px,1.6vw,18px); width: clamp(76px,10vw,110px); height: auto; filter: brightness(0) invert(1); opacity: .95; }
    .script {
      font-family: 'Dancing Script', 'Brush Script MT', cursive; font-weight: 700;
      color: var(--script-c); font-size: clamp(3rem,10vw,5.6rem); line-height: .95;
      text-shadow: 0 3px 14px rgba(0,0,0,.25); white-space: nowrap;
    }
    .title {
      margin-top: clamp(4px,1vw,10px);
      font-size: clamp(2.1rem,6.6vw,3.6rem); font-weight: 800; letter-spacing: -.035em; line-height: 1.12;
    }
    .title .accent { color: var(--accent-c); }
    .sub {
      margin-top: clamp(14px,2vw,22px);
      font-size: clamp(.98rem,2.6vw,1.2rem); font-weight: 500; color: var(--hero-sub); letter-spacing: -.01em;
    }

    /* 눈 언덕 */
    .hills { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: clamp(90px,12vw,170px); z-index: 1; display: block; }
    .hill-tree { position: absolute; z-index: 1; pointer-events: none; color: var(--hero-deco); }

    /* ===================== 본문 ===================== */
    main { position: relative; background: var(--mint-bg); padding: 0 16px clamp(40px,6vw,70px); }
    .inner { max-width: 760px; margin: 0 auto; }

    .sec-title {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      font-size: clamp(1.15rem,3.6vw,1.6rem); font-weight: 500; letter-spacing: -.03em; color: var(--navy);
      margin: 0 auto clamp(20px,3vw,30px); text-align: center;
    }
    .sec-title b { font-weight: 800; }
    .sec-title::before, .sec-title::after {
      content: ""; flex: 0 0 clamp(28px,7vw,64px); height: 7px;
      border-top: 2px solid var(--navy); border-bottom: 2px solid var(--navy);
    }

    /* 육각형 안내 */
    .hexes { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 clamp(4px,1.4vw,14px); }
    .hex {
      position: relative; width: clamp(160px,28vw,220px); aspect-ratio: 1 / 0.9;
      clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
      background: var(--mint-line);
      display: flex; align-items: center; justify-content: center;
    }
    .hex::before {
      content: ""; position: absolute; inset: 4px;
      clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
      background: var(--mint);
    }
    .hex:nth-child(2) { margin-top: clamp(40px,7vw,70px); }
    .hex-body { position: relative; z-index: 1; padding: 0 20%; text-align: center; font-size: clamp(.8rem,1.9vw,.95rem); line-height: 1.5; color: var(--text); word-break: keep-all; }
    .hex-num {
      display: block; font-weight: 800;
      font-size: clamp(1.7rem,4vw,2.3rem); line-height: 1; color: var(--navy); margin-bottom: 4px;
    }
    .hex-body strong { color: var(--navy); font-weight: 800; }

    /* 필수 확인 사항 */
    .notice {
      margin: clamp(22px,3.4vw,34px) auto 0; max-width: 680px;
      background: #fff; border: 2px dashed var(--mint-line); border-radius: var(--box-r, 16px);
      padding: 18px 20px; text-align: center;
      font-size: clamp(.85rem,2.2vw,.95rem); line-height: 1.75; color: #c62828; font-weight: 500;
    }
    .notice-title {
      display: inline-block; margin-bottom: 8px; padding: 4px 16px; border-radius: 999px;
      background: var(--navy); color: #fff; font-weight: 700; font-size: .9em;
    }
    .notice strong { color: #c62828; }

    /* 신청서 카드 */
    .form-card-wrap { position: relative; margin: clamp(56px,8vw,84px) auto 0; max-width: 760px; }
    .bow { color: var(--navy); position: absolute; left: 50%; top: 0; transform: translate(-50%,-78%); width: clamp(88px,12vw,120px); z-index: 3; }
    .form-card { position: relative; background: #fff; border: 3px solid var(--navy); border-radius: var(--card-r, 6px); overflow: hidden; z-index: 2; }
    .card-head {
      background: var(--head-c, var(--red)); color: #fff; text-align: center;
      padding: clamp(14px,2.2vw,20px) 16px;
    }
    .card-head h2 { font-size: clamp(1.15rem,3.4vw,1.55rem); font-weight: 800; letter-spacing: -.03em; }
    .card-head p { margin-top: 2px; font-size: clamp(.82rem,2.2vw,.95rem); color: rgba(255,255,255,.9); }
    .tag {
      position: absolute; top: -2px; right: clamp(14px,3vw,28px); z-index: 4; width: clamp(54px,7vw,70px);
      transform-origin: 50% 0; animation: swing 4.4s ease-in-out infinite;
    }
    .card-body { padding: clamp(10px,2vw,20px) clamp(4px,1.4vw,12px) clamp(14px,2vw,20px); }
    .sack { position: absolute; left: calc(-1 * clamp(40px,6vw,70px)); top: clamp(10px,2vw,30px); width: clamp(70px,9vw,104px); z-index: 1; }
    .reindeer { position: absolute; right: calc(-1 * clamp(30px,5vw,60px)); top: calc(-1 * clamp(40px,5vw,58px)); width: clamp(80px,10vw,116px); z-index: 1; }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0 20px; gap: 14px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(35,42,70,.18); border-top: 3px solid var(--navy); border-radius: 50%; animation: spin .9s linear infinite; }
    .loading-text { font-size: 14px; color: var(--navy); font-weight: 600; letter-spacing: .03em; }
    iframe { width: 100%; border: 0; display: block; opacity: 0; transition: opacity .3s ease, height .25s ease; }

    /* ===================== 푸터 ===================== */
    footer { position: relative; margin-top: auto; background: var(--mint-bg); }
    .foot-hills { display: block; width: 100%; height: clamp(70px,9vw,120px); }
    .foot-tree { position: absolute; right: clamp(10px,6vw,90px); bottom: clamp(64px,7.4vw,96px); width: clamp(70px,9vw,120px); z-index: 2; }
    .foot-tree.small { right: auto; left: clamp(10px,6vw,90px); width: clamp(48px,6vw,80px); }
    .foot-bar { background: var(--foot-bar); color: rgba(255,255,255,.9); text-align: center; padding: 16px 12px 18px; font-size: clamp(.78rem,1.8vw,.92rem); font-weight: 700; letter-spacing: .02em; }

    /* ===================== 파티클 ===================== */
    #snowLayer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 55; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes swing { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } }
    @keyframes fly { 0%,100% { transform: translate(0,0) rotate(-6deg); } 50% { transform: translate(10px,-8px) rotate(-3deg); } }
    @keyframes snowFall {
      0%   { transform: translateY(-10vh) translateX(0); opacity: 0; }
      10%  { opacity: .95; }
      50%  { transform: translateY(45vh) translateX(var(--dx,30px)); }
      90%  { opacity: .8; }
      100% { transform: translateY(112vh) translateX(0); opacity: 0; }
    }


    /* ===================== 테마 ===================== */
    html.t-red {
      --hero-1: #c0343a; --hero-2: #9c1f26; --hero-3: #6e1218; --script-c: #ffe2a6; --accent-c: #ffd25e;
      --mint-bg: #fbf4ea; --mint: #f5e4d0; --mint-line: #e3c7a3; --hill-1: #f1dcc4;
      --navy: #6e1218; --foot-bar: #6e1218; --red: #2f6a4b; --gold: #f2c04a;
    }
    html.t-green {
      --hero-1: #2f7154; --hero-2: #1f4d3a; --hero-3: #14352a; --script-c: #f4c64a; --accent-c: #ee3a3a;
      --mint-bg: #f4f1e8; --mint: #e6ecdc; --mint-line: #c3d3b8; --hill-1: #dfe8d6;
      --navy: #1f4d3a; --foot-bar: #1f4d3a; --red: #c9282f;
    }
    html.t-snow {
      --hero-1: #ffffff; --hero-2: #eef5f8; --hero-3: #dbe9ef; --hero-fg: #232a46; --hero-sub: #55607a;
      --hero-deco: #8fb4c8; --hero-dot: #a9c8d8; --script-c: #c9282f; --accent-c: #c9282f;
      --mint-bg: #f5f9fa; --mint: #e5f0f4; --mint-line: #c3dbe4; --hill-1: #d6e6ee;
      --navy: #232a46; --foot-bar: #232a46;
    }
    html.t-snow .logo { filter: none; }
    html.t-snow .hang svg path { fill: #e5b53a; }

    /* ===================== 헤더 배치 ===================== */
    html.h-label .script { font-size: clamp(1.8rem,5vw,2.6rem); margin-bottom: 2px; }
    html.h-label .title { font-size: clamp(2.6rem,8.6vw,4.6rem); }
    html.h-badge .hero-inner { display: flex; flex-direction: column; align-items: center; }
    html.h-badge .sub { order: 1; margin: 0 0 12px; padding: 6px 18px; border-radius: 999px; background: var(--accent-c); color: var(--hero-2); font-weight: 800; font-size: clamp(.85rem,2.2vw,1rem); }
    html.h-badge .title { order: 2; font-size: clamp(2.4rem,8vw,4.2rem); }
    html.h-badge .script { order: 3; margin-top: 4px; font-size: clamp(2rem,5.6vw,3rem); }
    html.h-badge .logo { order: 0; }

    /* ===================== 안내 형태 ===================== */
    .info-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; max-width: 620px; margin: 0 auto; }
    .info-card { background: #fff; border: 2px solid var(--mint-line); border-radius: var(--box-r,16px); padding: 26px 18px 20px; text-align: center; position: relative; font-size: .95rem; line-height: 1.6; word-break: keep-all; }
    .info-card .no { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: .9rem; }
    .info-card strong, .info-list strong { color: var(--navy); font-weight: 800; }
    .info-list { background: #fff; border: 2px solid var(--mint-line); border-radius: var(--box-r,16px); padding: 8px 20px; max-width: 680px; margin: 0 auto; }
    .info-list li { list-style: none; display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px dashed var(--mint-line); text-align: left; font-size: .97rem; line-height: 1.6; word-break: keep-all; }
    .info-list li:last-child { border-bottom: 0; }
    .info-list .no { flex: 0 0 auto; font-weight: 800; font-size: 1.3rem; line-height: 1.2; color: var(--red); }
    .hexes.as-other { display: block; }

    /* ===================== 신청서 머리글 색 ===================== */
    :root { --head-c: #c9282f; }
    html.c-navy { --head-c: var(--navy); }
    html.c-green { --head-c: #2f6a4b; }
    html.c-gold { --head-c: #e0a92b; }

    /* ===================== 장식 양 ===================== */
    html.d-medium .sleigh, html.d-medium .reindeer, html.d-medium .sack { display: none; }
    html.d-minimal .sleigh, html.d-minimal .reindeer, html.d-minimal .sack, html.d-minimal .hang,
    html.d-minimal .hill-tree, html.d-minimal .foot-tree, html.d-minimal .tag, html.d-minimal .bow { display: none; }
    html.d-minimal .form-card-wrap { margin-top: clamp(30px,5vw,48px); }


    /* ===================== 신청서 옆 장식 ===================== */
    .side-l, .side-r { display: none; }
    html.s-classic .sd-classic, html.s-snow .sd-snow, html.s-sweets .sd-sweets, html.s-orn .sd-orn { display: block; }
    .sd-orn.side-l, .sd-orn.side-r { top: calc(-1 * clamp(60px,7vw,90px)); }
    .sd-orn.side-l { left: calc(-1 * clamp(30px,5vw,60px)); }

    /* ===================== 신청서 장식 ===================== */
    html.k-simple .sack, html.k-simple .reindeer, html.k-simple .tag { display: none; }
    html.k-simple .bow { width: clamp(70px,9vw,92px); }
    html.k-none .sack, html.k-none .reindeer, html.k-none .tag, html.k-none .bow { display: none; }
    html.k-none .form-card-wrap { margin-top: clamp(30px,5vw,48px); }

    /* ===================== 모서리 ===================== */
    html.r-round { --card-r: 20px; --box-r: 20px; }
    html.r-square { --card-r: 0px; --box-r: 4px; }
    html.r-square .hex { clip-path: none; aspect-ratio: auto; min-height: 170px; border-radius: 4px; }
    html.r-square .hex::before { clip-path: none; border-radius: 2px; }

    /* ===================== 트윅 패널 ===================== */
    .tw-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 100; border: 0; border-radius: 999px; padding: 12px 18px; background: #232a46; color: #fff; font: inherit; font-weight: 800; font-size: 14px; box-shadow: 0 8px 22px rgba(0,0,0,.25); cursor: pointer; }
    .tw-panel { position: fixed; right: 16px; bottom: 70px; z-index: 100; width: min(320px, calc(100vw - 32px)); max-height: calc(100vh - 110px); overflow: auto; background: #fff; border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.22); padding: 16px 16px 12px; font-size: 13px; color: #2a2f3a; }
    .tw-panel.closed { display: none; }
    .tw-panel h3 { font-size: 15px; font-weight: 800; margin-bottom: 4px; }
    .tw-panel .hint { color: #6d7584; font-size: 12px; margin-bottom: 10px; }
    .tw-group { margin: 12px 0 0; }
    .tw-group > p { font-weight: 700; margin-bottom: 6px; }
    .tw-seg { display: flex; flex-wrap: wrap; gap: 6px; }
    .tw-seg button { border: 1.5px solid #d7dde2; background: #fff; border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer; color: #2a2f3a; }
    .tw-seg button.on { background: #232a46; border-color: #232a46; color: #fff; font-weight: 700; }
    .tw-seg .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .tw-code { margin-top: 14px; background: #f3f5f7; border-radius: 10px; padding: 10px; font-size: 12px; line-height: 1.5; word-break: break-all; }
    .tw-copy { margin-top: 8px; width: 100%; border: 0; border-radius: 10px; padding: 9px; background: #c9282f; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }


    /* ===================== 모션 그래픽 ===================== */
    /* 헤더 등장 */
    .hero-inner > * { animation: riseIn .9s cubic-bezier(.2,.7,.2,1) both; }
    .hero-inner > *:nth-child(1) { animation-delay: .05s; }
    .hero-inner > *:nth-child(2) { animation-delay: .25s; }
    .hero-inner > *:nth-child(3) { animation-delay: .45s; }
    .hero-inner > *:nth-child(4) { animation-delay: .65s; }
    .title .accent { display: inline-block; -webkit-text-stroke: 3px #fff; paint-order: stroke fill; animation: glow 3.2s ease-in-out 1.4s infinite; }
    /* 밤하늘 반짝임 */
    .sky-dots circle { animation: dotTw 2.8s ease-in-out infinite alternate; }
    /* 별똥별 */
    .shoot { position: absolute; top: 14%; left: 62%; width: clamp(80px,10vw,140px); height: 2px; border-radius: 2px; z-index: 1; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.95)); transform: rotate(-24deg); opacity: 0; animation: shoot 9s ease-in 3s infinite; }
    .shoot.s2 { top: 30%; left: 18%; animation-delay: 7.5s; animation-duration: 11s; }
    /* 썰매: 하늘을 가로질러 비행 */
    .sleigh { left: 0 !important; top: clamp(18px,3vw,40px) !important; animation: sleighFly 18s linear 1.5s infinite !important; opacity: 0; }
    /* 스크롤 등장 */
    .rv { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
    .rv.in { opacity: 1; transform: none; }
    .info-card .no { animation: none; }
    .info-card.in .no { animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; animation-delay: inherit; }
    /* 신청서 장식 */
    .bow { animation: bowWiggle 5s ease-in-out infinite; transform-origin: 50% 80%; }
    .side-r { animation: peek 4.6s ease-in-out infinite; }
    .side-l { animation: hop 3.8s ease-in-out infinite; transform-origin: 50% 100%; }
    .foot-tree { animation: treeSway 6s ease-in-out infinite; transform-origin: 50% 100%; }
    .foot-tree.small { animation-delay: -2s; }
    .hill-tree { animation: treeSway 7s ease-in-out infinite; transform-origin: 50% 100%; }

    @keyframes riseIn { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
    @keyframes glow { 0%,100% { text-shadow: 0 0 0 rgba(255,255,255,0); } 50% { text-shadow: 0 0 18px rgba(255,255,255,.55); } }
    @keyframes dotTw { from { opacity: .25; } to { opacity: 1; } }
    @keyframes shoot { 0% { opacity: 0; transform: rotate(-24deg) translateX(0); } 3% { opacity: 1; } 10% { opacity: 0; transform: rotate(-24deg) translateX(-38vw); } 100% { opacity: 0; transform: rotate(-24deg) translateX(-38vw); } }
    @keyframes sleighFly { 0% { transform: translate(-25vw, 30px) rotate(-8deg); opacity: 0; } 4% { opacity: 1; } 45% { transform: translate(55vw, -6px) rotate(-4deg); } 60% { transform: translate(115vw, 10px) rotate(-6deg); opacity: 1; } 61%,100% { transform: translate(115vw, 10px); opacity: 0; } }
    @keyframes pop { from { transform: translateX(-50%) scale(0); } to { transform: translateX(-50%) scale(1); } }
    @keyframes bowWiggle { 0%,80%,100% { transform: translate(-50%,-78%) rotate(0); } 85% { transform: translate(-50%,-82%) rotate(-6deg); } 90% { transform: translate(-50%,-80%) rotate(5deg); } 95% { transform: translate(-50%,-79%) rotate(-2deg); } }
    @keyframes peek { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(4deg); } }
    @keyframes hop { 0%,70%,100% { transform: translateY(0) scale(1,1); } 78% { transform: translateY(0) scale(1.06,.92); } 86% { transform: translateY(-10px) scale(.96,1.05); } 94% { transform: translateY(0) scale(1.03,.97); } }
    @keyframes treeSway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }


    /* 부제 '크리스마스 선물' 강조 */
    .sub .xmas { display: inline-block; font-weight: 800; white-space: nowrap; }
    .sub .xmas i { display: inline-block; font-style: normal;
      background: linear-gradient(100deg, #f4c64a 0%, #f4c64a 38%, #fff6d6 50%, #f4c64a 62%, #f4c64a 100%);
      background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: xWave 3.6s ease-in-out infinite, xShine 3.6s linear infinite; }
    .sub .xmas i.sp { width: .3em; animation: none; }

    @keyframes xShine { 0% { background-position: 100% 0; } 100% { background-position: -50% 0; } }

      { key: "info", label: "안내 형태", items: [["hex","육각형"],["cards","카드 3단"],["list","번호 목록"]] },
      { key: "head", label: "신청서 머리글 색", items: [["red","빨강","#c9282f"],["navy","테마색","#232a46"],["green","초록","#2f6a4b"],["gold","금색","#e0a92b"]] },
      { key: "deco", label: "장식 양", items: [["full","많이"],["medium","보통"],["minimal","최소"]] },
      { key: "card", label: "신청서 장식", items: [["full","기본"],["simple","리본만"],["none","없음"]] },
      { key: "side", label: "신청서 옆 장식", items: [["snow","눈사람·선물"],["sweets","사탕·쿠키"],["orn","오너먼트"],["classic","자루·루돌프"]] },
      { key: "corner", label: "모서리", items: [["soft","기본"],["round","둥글게"],["square","각지게"]] },
      { key: "snow", label: "떨어지는 눈", items: [[true,"켜기"],[false,"끄기"]] }
    ];

    (function readParams() {
      var p = new URLSearchParams(location.search);
      ["theme","hero","info","head","deco","card","side","corner"].forEach(function (k) { if (p.get(k)) CONFIG[k] = p.get(k); });
      if (p.get("snow")) CONFIG.snow = p.get("snow") !== "0";
      if (p.get("tweaks") === "1") CONFIG.panel = true;
    })();

    function applyDesign() {
      var h = document.documentElement;
      h.className = h.className.replace(/\b(t|h|c|d|k|s|r)-[a-z]+\b/g, "").trim();
      if (CONFIG.theme !== "navy") h.classList.add("t-" + CONFIG.theme);
      if (CONFIG.hero !== "script") h.classList.add("h-" + CONFIG.hero);
      if (CONFIG.head !== "red") h.classList.add("c-" + CONFIG.head);
      if (CONFIG.deco !== "full") h.classList.add("d-" + CONFIG.deco);
      if (CONFIG.card !== "full") h.classList.add("k-" + CONFIG.card);
      h.classList.add("s-" + CONFIG.side);
      if (CONFIG.corner !== "soft") h.classList.add("r-" + CONFIG.corner);
      var box = document.getElementById("infoContent");
      if (box && CURRENT_INFO.length) box.innerHTML = renderInfo(CURRENT_INFO);
      var layer = document.getElementById("snowLayer");
      if (layer) layer.style.display = CONFIG.snow ? "" : "none";
      if (window.__onDesign) window.__onDesign();
      updatePanel();
      setupReveal();
    }

    function updatePanel() {
      var g = document.getElementById("twGroups");
      if (!g || !CONFIG.panel) return;
      g.innerHTML = TW_OPTIONS.map(function (o) {
        return '<div class="tw-group"><p>' + o.label + '</p><div class="tw-seg">' + o.items.map(function (it) {
          var on = CONFIG[o.key] === it[0] ? " on" : "";
          var sw = it[2] ? '<span class="sw" style="background:' + it[2] + '"></span>' : "";
          return '<button type="button" class="' + on.trim() + '" data-k="' + o.key + '" data-v="' + it[0] + '">' + sw + it[1] + '</button>';
        }).join("") + '</div></div>';
      }).join("");
      var code = {}; ["theme","hero","info","head","deco","card","side","corner","snow"].forEach(function (k) { code[k] = CONFIG[k]; });
      document.getElementById("twCode").textContent = JSON.stringify(code).replace(/"([a-z]+)":/g, "$1: ").replace(/,/g, ", ");
    }

    document.addEventListener("DOMContentLoaded", function () {
      if (!CONFIG.panel) return;
      var tg = document.getElementById("twToggle"), pn = document.getElementById("twPanel");
      tg.classList.remove("is-hidden"); pn.classList.remove("is-hidden");
      if (window.innerWidth <= 640) pn.classList.add("closed");
      tg.addEventListener("click", function () { pn.classList.toggle("closed"); });
      document.getElementById("twGroups").addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        var v = b.getAttribute("data-v");
        CONFIG[b.getAttribute("data-k")] = v === "true" ? true : v === "false" ? false : v;
        applyDesign();
      });
      document.getElementById("twCopy").addEventListener("click", function () {
        var t = document.getElementById("twCode").textContent;
        if (navigator.clipboard) navigator.clipboard.writeText(t);
        this.textContent = "복사했습니다"; var self = this; setTimeout(function () { self.textContent = "설정값 복사"; }, 1400);
      });
    });

    /* === Google Apps Script 폼 주소 (날짜 분기) === */
    var GAS_OLD = "https://script.google.com/macros/s/AKfycby2gPMQDhyagAv1fSR-V7rLHaquVI4ggoNS-vD2GwvUmZQiQCvoqkqWH2mlMi56JRo9/exec";
    var GAS_NEW = "https://script.google.com/macros/s/AKfycby2gPMQDhyagAv1fSR-V7rLHaquVI4ggoNS-vD2GwvUmZQiQCvoqkqWH2mlMi56JRo9/exec";

    /* === 안내 문구 (기존 문구 그대로, 육각형 1칸 = 문단 1개) === */
    var INFO_OLD = [
      '종합 프리패스 결제 고객님께 <strong><br>웰컴 키트</strong>가 지급될 예정입니다.',
      '정확한 배송을 위해 <strong>이름, 연락처, 주소</strong> 등 정보를 정확하게 입력 부탁드립니다.'
    ];
    var INFO_NEW = [
      '종합 프리패스 결제 고객님께 <strong>웰컴 키트</strong>가 지급될 예정입니다.',
      '정확한 배송을 위해 <strong>이름, 연락처, 주소</strong> 등 정보를 정확하게 입력 부탁드립니다.'
    ];

    /* === 스크롤 등장 모션 === */
    var revealIO = ("IntersectionObserver" in window) ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); revealIO.unobserve(e.target); } });
    }, { threshold: 0.15 }) : null;
    function setupReveal() {
      var groups = [".sec-title", ".info-card, .hex, .info-list li", ".notice", ".form-card-wrap"];
      groups.forEach(function (sel) {
        var els = document.querySelectorAll(sel);
        for (var i = 0; i < els.length; i++) {
          var el = els[i];
          if (el.classList.contains("in")) continue;
          el.classList.add("rv");
          el.style.transitionDelay = (i * 0.12) + "s";
          if (revealIO) revealIO.observe(el); else el.classList.add("in");
        }
      });
    }
    var CURRENT_INFO = [];
    function renderInfo(list) {
      CURRENT_INFO = list;
      var box = document.getElementById("infoContent");
      if (CONFIG.info === "cards") {
        box.className = "hexes as-other";
        return '<div class="info-cards">' + list.map(function (txt, i) {
          return '<div class="info-card"><span class="no">0' + (i + 1) + '</span>' + txt + '</div>';
        }).join("") + '</div>';
      }
      if (CONFIG.info === "list") {
        box.className = "hexes as-other";
        return '<ul class="info-list">' + list.map(function (txt, i) {
          return '<li><span class="no">0' + (i + 1) + '</span><span>' + txt + '</span></li>';
        }).join("") + '</ul>';
      }
      box.className = "hexes";
      return list.map(function (txt, i) {
        return '<div class="hex"><p class="hex-body"><span class="hex-num">0' + (i + 1) + '</span>' + txt + '</p></div>';
      }).join("");
    }

    /* === iframe 폼 분기 + 안내 문구 === */
    document.addEventListener("DOMContentLoaded", function () {
      var params = new URLSearchParams(window.location.search);
      var preview = params.get("preview");
      var now = new Date();
      var isNew = preview === "new" || (!preview && now >= new Date("2026-04-01T00:00:00+09:00"));

      var iframe = document.getElementById("giftFormFrame");
      iframe.src = isNew ? GAS_NEW : GAS_OLD;

      var isMobile = window.innerWidth <= 768;
      iframe.style.height = (isNew ? (isMobile ? 600 : 800) : (isMobile ? 1250 : 2000)) + "px";

      document.getElementById("infoContent").innerHTML = renderInfo(isNew ? INFO_NEW : INFO_OLD);
      applyDesign();
    });

    /* === iframe 로드 완료 === */
    document.getElementById("giftFormFrame").addEventListener("load", function () {
      document.getElementById("loadingWrap").style.display = "none";
      this.style.opacity = "1";
    });

    /* === 자식(구글 폼) → 부모 메시지 처리 === */
    window.addEventListener("message", function (event) {
      var d = event.data;
      if (!d) return;
      var iframe = document.getElementById("giftFormFrame");
      if (d.type === "setHeight" && iframe) {
        iframe.style.height = Math.max(d.height, 300) + "px";
      } else if (d.type === "formSubmitted") {
        var box = document.getElementById("infoBox");
        if (box) box.style.display = "none";
        window.scrollTo({ top: 0, behavior: "smooth" });
        postHeightToParent();
      }
    });

    /* === 이 페이지가 임베드된 경우, 전체 높이를 부모에 전달 (잘림 방지) === */
    var lastH = 0;
    function postHeightToParent() {
      try {
        if (!window.parent || window.parent === window) return;
        var h = Math.ceil(document.documentElement.scrollHeight);
        if (h && h !== lastH) {
          lastH = h;
          window.parent.postMessage({ type: "setHeight", height: h }, "*");
        }
      } catch (e) {}
    }
    window.addEventListener("load", postHeightToParent);
    window.addEventListener("resize", postHeightToParent);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(postHeightToParent).observe(document.documentElement);
    }
    setInterval(postHeightToParent, 1000);

    /* === 밤하늘 눈 점 === */
    (function skyDots() {
      var svg = document.getElementById("skyDots"), html = "";
      for (var i = 0; i < 46; i++) {
        var x = Math.random() * 100, y = Math.random() * 70, r = 0.25 + Math.random() * 0.45;
        html += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(2) + '" fill="var(--hero-dot)" opacity="' + (0.4 + Math.random() * 0.5).toFixed(2) + '" style="fill:var(--hero-dot); animation-delay:-' + (Math.random() * 3).toFixed(2) + 's; animation-duration:' + (1.8 + Math.random() * 2.4).toFixed(2) + 's"/>';
      }
      svg.innerHTML = html;
    })();

    /* === 떨어지는 눈 결정 (모양 4종 · 원근 3단계) === */
    (function particles() {
      var layer = document.getElementById("snowLayer");
      function arms(n, f) { var d = ""; for (var k = 0; k < n; k++) d += f(k * 360 / n); return d; }
      function pt(a, r) { var t = (a - 90) * Math.PI / 180; return (r * Math.cos(t)).toFixed(1) + " " + (r * Math.sin(t)).toFixed(1); }
      function line(a1, r1, a2, r2) { return "M" + pt(a1, r1) + " L" + pt(a2, r2); }
      var SHAPES = [
        /* 1. 고사리형: 가지 2쌍 */
        function () { return arms(6, function (a) { return line(a, 0, a, 44) + line(a, 16, a - 28, 30) + line(a, 16, a + 28, 30) + line(a, 30, a - 22, 40) + line(a, 30, a + 22, 40); }); },
        /* 2. 육각판 + 갈래 끝 */
        function () { return arms(6, function (a) { return line(a, 14, a, 44) + line(a, 36, a - 16, 46) + line(a, 36, a + 16, 46) + line(a, 14, a + 60, 14); }); },
        /* 3. 별 모양 결정: 긴 팔·짧은 팔 교차 */
        function () { return arms(12, function (a) { var r = (Math.round(a / 30) % 2) ? 26 : 44; return line(a, 0, a, r) + (r > 30 ? line(a, 24, a - 18, 32) + line(a, 24, a + 18, 32) : ""); }); },
        /* 4. 바늘형 + 가운데 고리 */
        function () { return arms(6, function (a) { return line(a, 10, a, 46) + line(a, 22, a - 34, 28) + line(a, 22, a + 34, 28); }) + "M10 0 A10 10 0 1 0 -10 0 A10 10 0 1 0 10 0"; }
      ];
      var SVGS = SHAPES.map(function (f) {
        return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100"><path d="' + f() + '" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/></svg>';
      });
      var DEPTHS = [
        { p: 0.45, size: [8, 13], dur: [15, 20], op: 0.55, blur: 0.6, sway: [10, 18] },
        { p: 0.40, size: [14, 21], dur: [10, 14], op: 0.85, blur: 0, sway: [18, 32] },
        { p: 0.15, size: [24, 34], dur: [7, 10], op: 0.95, blur: 0, sway: [26, 44] }
      ];
      function rnd(a) { return a[0] + Math.random() * (a[1] - a[0]); }
      function spawn() {
        if (!CONFIG.snow || document.hidden) return;
        var r = Math.random(), d = DEPTHS[0];
        if (r > DEPTHS[0].p) d = (r > DEPTHS[0].p + DEPTHS[1].p) ? DEPTHS[2] : DEPTHS[1];
        var size = rnd(d.size), dur = rnd(d.dur);
        var el = document.createElement("div");
        el.className = "flake";
        el.innerHTML = "<i>" + SVGS[Math.floor(Math.random() * SVGS.length)] + "</i>";
        el.style.cssText = "left:" + (Math.random() * 100) + "vw;width:" + size + "px;height:" + size + "px;" +
          "--op:" + d.op + ";animation-duration:" + dur + "s;" + (d.blur ? "filter:blur(" + d.blur + "px);" : "");
        var inner = el.firstChild, svg = inner.firstChild;
        inner.style.cssText = "--sw:" + rnd(d.sway).toFixed(0) + "px;animation-duration:" + (2.2 + Math.random() * 2.2).toFixed(2) + "s;animation-delay:-" + (Math.random() * 2).toFixed(2) + "s";
        svg.style.cssText = "--rot:" + (Math.random() > .5 ? 360 : -360) + "deg;animation-duration:" + (6 + Math.random() * 10).toFixed(1) + "s";
        layer.appendChild(el);
        setTimeout(function () { el.remove(); }, (dur + 0.5) * 1000);
      }
      for (var i = 0; i < 10; i++) setTimeout(spawn, i * 250);
      setInterval(spawn, 420);
    })();
  </script>
</body>
</html>
