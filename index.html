<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>단꿈e 사은품 신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, "Noto Sans KR", sans-serif;
      background-color: #ffffff;
      color: #333;
      line-height: 1.4;
      overflow-x: hidden;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* ---------------- 배너 영역 ---------------- */
    .banner-wrapper {
      width: 100%;
      padding: 10px 0 4px;
      display: flex;
      justify-content: center;
    }

    /* ✅ 레이어 배너 스택 */
    .banner-stack{
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    /* 배너 공통 */
    .banner-stack img{
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    /* base */
    .banner-base{
      position: relative;
      z-index: 1;
    }

    /* overlay(나무) */
    .banner-tree{
      position: absolute;
      top: -1px;
      left: -1px;
      width: calc(100% + 2px);
      pointer-events: none;
      user-select: none;
      will-change: transform;
      z-index: 2;
    }

    .tree-left{
      transform-origin: 0% 0%;
      animation: swayLeft 5s ease-in-out infinite;
    }

    .tree-right{
      transform-origin: 100% 0%;
      animation: swayRight 6.2s ease-in-out infinite;
    }

    @keyframes swayLeft{
      0%   { transform: rotate(0deg) translateX(0px) translateY(0px); }
      25%  { transform: rotate(1.8deg) translateX(2px) translateY(1px); }
      50%  { transform: rotate(2.8deg) translateX(3px) translateY(2px); }
      75%  { transform: rotate(1.5deg) translateX(2px) translateY(1px); }
      100% { transform: rotate(0deg) translateX(0px) translateY(0px); }
    }

    @keyframes swayRight{
      0%   { transform: rotate(0deg) translateX(0px) translateY(0px); }
      25%  { transform: rotate(-1.6deg) translateX(-2px) translateY(1px); }
      50%  { transform: rotate(-2.4deg) translateX(-3px) translateY(2px); }
      75%  { transform: rotate(-1.3deg) translateX(-2px) translateY(1px); }
      100% { transform: rotate(0deg) translateX(0px) translateY(0px); }
    }

    @media (max-width: 768px){
      .banner-stack{ max-width: 92%; }

      .tree-left{ animation-duration: 5.6s; }
      .tree-right{ animation-duration: 6.8s; }

      @keyframes swayLeft{
        0%   { transform: rotate(0deg) translateX(0px) translateY(0px); }
        25%  { transform: rotate(1.2deg) translateX(1px) translateY(1px); }
        50%  { transform: rotate(2.0deg) translateX(2px) translateY(1px); }
        75%  { transform: rotate(1.0deg) translateX(1px) translateY(1px); }
        100% { transform: rotate(0deg) translateX(0px) translateY(0px); }
      }

      @keyframes swayRight{
        0%   { transform: rotate(0deg) translateX(0px) translateY(0px); }
        25%  { transform: rotate(-1.1deg) translateX(-1px) translateY(1px); }
        50%  { transform: rotate(-1.7deg) translateX(-2px) translateY(1px); }
        75%  { transform: rotate(-0.9deg) translateX(-1px) translateY(1px); }
        100% { transform: rotate(0deg) translateX(0px) translateY(0px); }
      }
    }

    /* ---------------- 본문 영역 ---------------- */
    .content-wrapper {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      text-align: center;
    }

    .info-box {
      background: linear-gradient(135deg, #fff0f5 0%, #fce4f0 40%, #fef3e2 100%);
      border: 1.5px solid rgba(255, 182, 210, 0.5);
      border-radius: 24px;
      padding: 28px 24px;
      margin: 24px auto 36px;
      max-width: 760px;
      box-shadow: 0 6px 24px rgba(255, 150, 180, 0.15);
      font-size: 1rem;
      line-height: 1.8;
      text-align: center;
    }

    .info-box strong {
      color: #d63384;
      font-weight: 800;
    }

    .info-box p + p {
      margin-top: 10px;
    }

    .info-box .warning-text {
      display: block;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1.5px dashed rgba(255, 150, 180, 0.5);
      font-size: 0.95rem;
      line-height: 1.7;
      color: #c0392b;
      font-weight: 500;
    }

    /* ---------------- iframe (폼 영역) ---------------- */
    .iframe-container {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
    }

    .iframe-container iframe {
      width: 100%;
      border: 0;
      display: block;
      min-height: 2000px;
      transition: height 0.25s ease;
    }

    @media (max-width: 768px) {
      .iframe-container iframe {
        min-height: 1000px;
      }
    }

    /* ---------------- Bottom Decoration ---------------- */
    .footer-deco {
      width: 100%;
      margin-top: 40px;
    }

    .footer-deco img {
      display: block;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    /* =====================================================
       🌸 꽃잎 떨어지는 효과
       ===================================================== */
    .sakura {
      position: fixed;
      top: -40px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      will-change: transform;
      animation-name: sakuraFall;
      animation-timing-function: linear;
    }

    .sakura img {
      display: block;
      height: auto;
    }

    @keyframes sakuraFall {
      0% {
        transform: translate3d(0, -40px, 0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate3d(0, 110vh, 0) rotate(360deg);
        opacity: 0.8;
      }
    }
  </style>

  <script>
    // 1. 날짜 분기 - 4월 1일 기준 iframe src 자동 전환
    const GAS_OLD = "https://script.google.com/macros/s/AKfycbzuw-vJIFvx5y4X5IGygbkRtMwBxEh6l17CKQjOQRw36zSEReamhs5S5hqWNq0L7KBI/exec"; // 기존 (사은품 2종)
    const GAS_NEW = "https://script.google.com/macros/s/AKfycby2gPMQDhyagAv1fSR-V7rLHaquVI4ggoNS-vD2GwvUmZQiQCvoqkqWH2mlMi56JRo9/exec"; // 신규 (웰컴키트)

    const INFO_OLD = `
      <p>
        종합 프리패스[12개월 수강권] 결제 고객님께<br>
        <strong>단꿈아이 대모험 시리즈 2종</strong>이 지급될 예정입니다.
      </p>
      <p>
        하단 사은품 선택 항목에서<br>
        <strong>수령을 희망하는 2종</strong>을 선택해 주세요.
      </p>
      <p>
        선택하신 사은품은 <strong>4월 30일(목)</strong> 이후 <br>순차 발송될 예정이며,
        정확한 배송을 위해 <strong>이름, 연락처, 주소</strong> 등 <br>정보를 정확하게 입력 부탁드립니다.
      </p>`;

    const INFO_NEW = `
      <p>
        종합 프리패스[12개월 수강권] 결제 고객님께<br>
        <strong>웰컴 키트</strong>가 지급될 예정입니다.
      </p>
      <p style="margin-top: 12px;">
        정확한 배송을 위해 <strong>이름, 연락처, 주소</strong> 등<br>
        정보를 정확하게 입력 부탁드립니다.
      </p>`;

    document.addEventListener("DOMContentLoaded", function () {
      const params = new URLSearchParams(window.location.search);
      const preview = params.get("preview");

      const now = new Date();
      const isNew = preview === "new" || (!preview && now >= new Date("2026-04-01T00:00:00+09:00"));

      // iframe src 분기
      const iframe = document.getElementById("giftFormFrame");
      iframe.src = isNew ? GAS_NEW : GAS_OLD;

      // 안내 문구 분기
      const infoContent = document.getElementById("infoContent");
      infoContent.innerHTML = isNew ? INFO_NEW : INFO_OLD;
    });

    // 2. iframe 높이 조절
    window.addEventListener("message", function (event) {
      if (!event.data || event.data.type !== "setHeight") return;

      const iframe = document.getElementById("giftFormFrame");
      if (!iframe) return;

      const newHeight = Math.max(event.data.height, 600);
      iframe.style.height = newHeight + "px";
    });

    // 3. 제출 완료 처리 (안내 박스 숨김 + 상단 이동)
    window.addEventListener("message", function (event) {
      if (!event.data || event.data.type !== "formSubmitted") return;

      const infoBox = document.querySelector(".info-box");
      if (infoBox) infoBox.style.display = "none";

      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    /* 🌸 꽃잎 생성 */
    function createSakura() {
      const sakura = document.createElement("div");
      sakura.className = "sakura";
      sakura.innerHTML = "<img src='cherry_blossom.png' alt='' aria-hidden='true' />";

      sakura.style.left = (Math.random() * window.innerWidth) + "px";
      sakura.style.animationDuration = (6 + Math.random() * 4) + "s";
      sakura.style.marginLeft = (-10 + Math.random() * 20) + "px";

      const isMobile = window.innerWidth < 768;
      const minSize = isMobile ? 14 : 18;
      const maxSize = isMobile ? 24 : 30;

      document.body.appendChild(sakura);

      const img = sakura.querySelector("img");
      img.style.width = (minSize + Math.random() * (maxSize - minSize)) + "px";

      sakura.style.transform = "rotate(" + (Math.random() * 360) + "deg)";

      setTimeout(() => sakura.remove(), 12000);
    }

    setInterval(createSakura, 700);
  </script>
</head>

<body>
  <div class="page-wrapper">

    <!-- 배너: 3레이어 + 나무 흔들림 (변경 없음) -->
    <header class="banner-wrapper">
      <div class="banner-stack">
        <img src="banner_01.png" class="banner-base" alt="단꿈e 특별 사은품 증정 이벤트" />
        <img src="banner_02.png" class="banner-tree tree-left" alt="" aria-hidden="true" />
        <img src="banner_03.png" class="banner-tree tree-right" alt="" aria-hidden="true" />
      </div>
    </header>

    <main class="content-wrapper">

      <section class="info-box">
        <div id="infoContent"></div>
        <div class="warning-text">
          <p style="font-weight: 700;">필수 확인 사항</p>
          <span style="display: block;">※ 주소지 오기입으로 인한 반송 건은 재발송 되지 않습니다.</span>
          <span style="display: block;">※ 주소 입력을 완료하지 못하신 경우, 단꿈e 고객센터(<strong>1670-0285</strong>)로 문의해 주세요.</span>
        </div>
      </section>

      <div class="iframe-container">
        <iframe
          id="giftFormFrame"
          src="https://script.google.com/macros/s/AKfycbzuw-vJIFvx5y4X5IGygbkRtMwBxEh6l17CKQjOQRw36zSEReamhs5S5hqWNq0L7KBI/exec"
          title="단꿈e 사은품 신청 폼">
        </iframe>
      </div>

      <footer class="footer-deco">
        <img src="banner-02.png" alt="" />
      </footer>

    </main>

  </div>
</body>
</html>
