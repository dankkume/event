<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>단꿈e 사은품 신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />

  <script>
    /* =====================================================
       시즌 분기 — 2026-09-01 00:00 (KST) 부터 가을 테마
       ?season=summer / ?season=autumn 으로 미리보기 가능
       ===================================================== */
    (function () {
      var AUTUMN_START = new Date("2026-09-01T00:00:00+09:00");
      var q = new URLSearchParams(location.search).get("season");
      var isAutumn = q === "autumn" || (q !== "summer" && new Date() >= AUTUMN_START);
      document.documentElement.classList.add(isAutumn ? "season-autumn" : "season-summer");
      window.__IS_AUTUMN__ = isAutumn;
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== 시즌 토큰 ===== */
    :root {
      --page-bg: linear-gradient(180deg, #cfeafb 0px, #ddf1fb 200px, #eaf6fc 440px, #e7f5f5 100%);
      --water-grad: linear-gradient(165deg,#7cd0f7 0%,#3a98e6 48%,#1f6fd0 100%);
      --banner-shadow: rgba(31,140,180,.2);
      --dim: radial-gradient(62% 72% at 50% 50%, rgba(7,62,88,.36) 0%, rgba(7,62,88,.14) 46%, transparent 72%);
      --eyebrow-fg: #0f88a0;
      --eyebrow-shadow: rgba(0,80,110,.18);
      --accent: #ffd84d;
      --headline-shadow-1: rgba(3,42,62,.6);
      --headline-shadow-2: rgba(3,42,62,.45);
      --info-bg: linear-gradient(135deg,#e9fcff 0%,#d7f4f4 46%,#e8f6ff 100%);
      --info-border: rgba(38,199,191,.4);
      --info-strong: #00827c;
      --info-shadow: rgba(38,199,191,.12);
      --divider: rgba(38,199,191,.5);
      --spinner: #00bab1;
      --spinner-track: rgba(38,199,191,.3);
      --footer-text-shadow: rgba(0,90,120,.4);
      --headline-fg: #fff;
      --stroke-fg: #fff;
      --footer-grad: var(--water-grad);
      --footer-fg: rgba(255,255,255,.97);
      --link: #0f88a0;
      --link-hover: #00827c;
    }
    html.season-autumn {
      --page-bg: linear-gradient(180deg, #f9e7cd 0px, #fbeedb 200px, #fdf5e9 440px, #fbf3e7 100%);
      --water-grad: linear-gradient(165deg,#f2e7d1 0%,#ecdfc5 55%,#e6d6b8 100%);
      --banner-shadow: rgba(180,120,60,.2);
      --dim: radial-gradient(46% 58% at 50% 50%, rgba(246,238,222,.9) 0%, rgba(246,238,222,.55) 55%, transparent 78%);
      --eyebrow-fg: #c0561d;
      --eyebrow-shadow: rgba(140,60,20,.2);
      --accent: #a8443a;
      --headline-shadow-1: rgba(255,255,255,.95);
      --headline-shadow-2: rgba(255,255,255,.8);
      --info-bg: linear-gradient(135deg,#fff6e6 0%,#fbe9cf 46%,#fff3e2 100%);
      --info-border: rgba(226,140,58,.45);
      --info-strong: #b8541b;
      --info-shadow: rgba(226,140,58,.14);
      --divider: rgba(226,140,58,.55);
      --spinner: #e2762a;
      --spinner-track: rgba(226,140,58,.3);
      --footer-text-shadow: rgba(255,255,255,.85);
      --headline-fg: #4a3323;
      --stroke-fg: #fffdf7;
      --footer-grad: linear-gradient(165deg,#eddfc2 0%,#e5d2ae 55%,#dcc79c 100%);
      --footer-fg: #6b4a2c;
      --link: #c0561d;
      --link-hover: #8a3d12;
    }

    body {
      font-family: "Paperlogy", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, "Noto Sans KR", sans-serif;
      background: var(--page-bg);
      color: #25282b;
      line-height: 1.4;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--link); }
    a:hover { color: var(--link-hover); }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; }

    /* ===== 시즌별 표시/숨김 ===== */
    html.season-summer .only-autumn { display: none !important; }
    html.season-autumn .only-summer { display: none !important; }

    /* ===== 배너 ===== */
    .banner {
      position: relative;
      width: 100%;
      height: clamp(240px, 30vw, 380px);
      overflow: hidden;
      box-shadow: 0 8px 22px var(--banner-shadow);
    }
    .water { position: absolute; inset: 0; z-index: 0; background: var(--water-grad); }
    footer .water { background: var(--footer-grad); }
    .deco { position: absolute; pointer-events: none; }
    .deco svg, .deco > div { display: block; width: 100%; height: auto; }

    .text-dim { position: absolute; inset: 0; z-index: 6; pointer-events: none; background: var(--dim); }
    .text-block {
      position: absolute; inset: 0; z-index: 8; pointer-events: none;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 0 14%;
    }
    .logo { height: auto; filter: drop-shadow(0 2px 7px rgba(255,255,255,.9)); }
    .eyebrow {
      display: inline-block; padding: 5px 16px; border-radius: 999px; background: #fff;
      color: var(--eyebrow-fg); font-size: clamp(.72rem,2vw,.92rem); font-weight: 700; letter-spacing: -.01em;
      box-shadow: 0 4px 12px var(--eyebrow-shadow);
    }
    .headline {
      margin-top: clamp(8px,1.6vw,14px); font-size: clamp(1.7rem,5.6vw,3rem); font-weight: 800;
      letter-spacing: -.03em; color: var(--headline-fg); white-space: nowrap;
      text-shadow: 0 2px 4px var(--headline-shadow-1), 0 6px 18px var(--headline-shadow-2);
    }
    .headline .accent { color: var(--accent); }
    .hello-script { font-family: 'Pacifico', cursive; font-size: clamp(1.9rem,6vw,3.3rem); color: var(--headline-fg); transform: rotate(-4deg); text-shadow: 0 3px 10px var(--headline-shadow-2); line-height: 1; }
    .hello-season { margin-top: clamp(2px,.6vw,6px); font-size: clamp(2.4rem,8.4vw,4.7rem); font-weight: 800; letter-spacing: .02em; color: var(--accent); -webkit-text-stroke: 2.5px var(--stroke-fg); text-shadow: 0 5px 12px var(--headline-shadow-2); line-height: .92; }

    /* ===== 본문 ===== */
    main { width: 100%; background: #fff; padding: clamp(26px,4.5vw,46px) 16px clamp(30px,4vw,46px); }
    .inner { max-width: 760px; margin: 0 auto; text-align: center; }
    .info-box {
      background: var(--info-bg);
      border: 1.5px solid var(--info-border); border-radius: 20px; padding: 28px 24px;
      margin: 0 auto 28px; max-width: 740px; box-shadow: 0 4px 16px var(--info-shadow);
      font-size: clamp(.95rem,2.5vw,1rem); line-height: 1.8;
    }
    .info-box strong { color: var(--info-strong); font-weight: 800; }
    .info-box p + p { margin-top: 10px; }
    .warning {
      margin-top: 18px; padding-top: 16px; border-top: 1.5px dashed var(--divider);
      font-size: clamp(.85rem,2.2vw,.95rem); line-height: 1.7; color: #c0392b; font-weight: 500;
    }
    .warning strong { color: #c0392b; }
    .iframe-wrap { width: 100%; margin: 0 auto; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0 20px; gap: 14px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--spinner-track); border-top: 3px solid var(--spinner); border-radius: 50%; animation: spin .9s linear infinite; }
    .loading-text { font-size: 14px; color: var(--info-strong); font-weight: 600; letter-spacing: .03em; }
    iframe { width: 100%; border: 0; display: block; opacity: 0; transition: opacity .3s ease, height .25s ease; }

    /* ===== 푸터 ===== */
    footer { width: 100%; margin-top: auto; position: relative; overflow: hidden; height: clamp(140px,19vw,200px); }
    .footer-text {
      position: absolute; bottom: clamp(16px,2.6vw,26px); left: 0; right: 0; text-align: center;
      color: var(--footer-fg); font-size: clamp(.74rem,1.8vw,.92rem); font-weight: 700;
      letter-spacing: .02em; z-index: 4; text-shadow: 0 2px 6px var(--footer-text-shadow);
    }

    /* ===== 파티클(버블 / 낙엽) ===== */
    #bubbleLayer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 55; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes swayL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes swayR { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
    @keyframes bobA { 0%,100% { transform: translateY(0) rotate(var(--rot,0deg)); } 50% { transform: translateY(-9px) rotate(calc(var(--rot,0deg) + 3deg)); } }
    @keyframes bobB { 0%,100% { transform: translate(-50%,0) rotate(0deg); } 50% { transform: translate(-50%,-10px) rotate(2deg); } }
    @keyframes floatRot { 0%,100% { transform: translateY(0) rotate(var(--rot,0deg)); } 50% { transform: translateY(-7px) rotate(calc(var(--rot,0deg) - 4deg)); } }
    @keyframes bubbleRise { 0% { transform: translateY(0) translateX(0); opacity: 0; } 12% { opacity:.7; } 85% { opacity:.45; } 100% { transform: translateY(-112vh) translateX(24px); opacity: 0; } }
    @keyframes leafFall {
      0%   { transform: translateY(-12vh) translateX(0) rotate(0deg); opacity: 0; }
      10%  { opacity: .95; }
      50%  { transform: translateY(45vh) translateX(var(--dx,40px)) rotate(calc(var(--spin,540deg) / 2)); }
      90%  { opacity: .85; }
      100% { transform: translateY(115vh) translateX(0) rotate(var(--spin,540deg)); opacity: 0; }
    }

    .is-hidden { display: none !important; }
  </style>
</head>

      }
    })();

    /* === iframe 폼 분기 + 안내 문구 === */
    document.addEventListener("DOMContentLoaded", function () {
      var params = new URLSearchParams(window.location.search);
      var preview = params.get("preview");
      var now = new Date();
      var isNew = preview === "new" || (!preview && now >= new Date("2026-04-01T00:00:00+09:00"));

      var iframe = document.getElementById("giftFormFrame");
      iframe.src = isNew ? GAS_NEW : GAS_OLD;

      var isMobile = window.innerWidth <= 768;
      iframe.style.height = (isNew ? (isMobile ? 600 : 800) : (isMobile ? 1250 : 2000)) + "px";

      document.getElementById("infoContent").innerHTML = isNew ? INFO_NEW : INFO_OLD;
    });

    /* === iframe 로드 완료 === */
    document.getElementById("giftFormFrame").addEventListener("load", function () {
      document.getElementById("loadingWrap").style.display = "none";
      this.style.opacity = "1";
    });

    /* === 자식(구글 폼) → 부모 메시지 처리 === */
    window.addEventListener("message", function (event) {
      var d = event.data;
      if (!d) return;
      var iframe = document.getElementById("giftFormFrame");
      if (d.type === "setHeight" && iframe) {
        iframe.style.height = Math.max(d.height, 300) + "px";
      } else if (d.type === "formSubmitted") {
        var box = document.getElementById("infoBox");
        if (box) box.style.display = "none";
        window.scrollTo({ top: 0, behavior: "smooth" });
        postHeightToParent();
      }
    });

    /* === 이 페이지가 임베드된 경우, 전체 높이를 부모에 전달 (잘림 방지) === */
    var lastH = 0;
    function postHeightToParent() {
      try {
        if (!window.parent || window.parent === window) return;
        var h = Math.ceil(document.documentElement.scrollHeight);
        if (h && h !== lastH) {
          lastH = h;
          window.parent.postMessage({ type: "setHeight", height: h }, "*");
        }
      } catch (e) {}
    }
    window.addEventListener("load", postHeightToParent);
    window.addEventListener("resize", postHeightToParent);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(postHeightToParent).observe(document.documentElement);
    }
    setInterval(postHeightToParent, 1000);

    /* === 파티클: 여름=물방울, 가을=낙엽 === */
    (function particles() {
      var layer = document.getElementById("bubbleLayer");

      var LEAF_SVGS = [
        "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 132\" style=\"overflow:visible;\"><path d=\"M50 6 C55 20 61 26 69 24 C67 31 64 36 68 38 C76 36 84 32 90 28 C86 38 80 48 74 54 C80 56 86 56 92 54 C84 62 74 68 64 72 C67 76 73 78 79 78 C69 84 58 86 50 86 C42 86 31 84 21 78 C27 78 33 76 36 72 C26 68 16 62 8 54 C14 56 20 56 26 54 C20 48 14 38 10 28 C16 32 24 36 32 38 C36 36 33 31 31 24 C39 26 45 20 50 6 Z\" fill=\"#ef9829\"></path><g stroke=\"#3d2b1f\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M50 124 L50 22\"></path><path d=\"M50 58 L26 42\"></path><path d=\"M50 58 L74 42\"></path><path d=\"M50 74 L32 64\"></path><path d=\"M50 74 L68 64\"></path></g></svg>",
        "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 132\" style=\"overflow:visible;\"><path d=\"M50 6 C58 8 62 16 59 24 C69 20 78 25 77 34 C86 32 92 40 88 48 C96 52 95 62 87 65 C90 74 82 81 73 77 C71 85 61 88 55 82 C55 88 52 94 50 100 C48 94 45 88 45 82 C39 88 29 85 27 77 C18 81 10 74 13 65 C5 62 4 52 12 48 C8 40 14 32 23 34 C22 25 31 20 41 24 C38 16 42 8 50 6 Z\" fill=\"#b5602f\"></path><g stroke=\"#3d2b1f\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M50 126 L50 18\"></path><path d=\"M50 42 L28 30\"></path><path d=\"M50 42 L72 30\"></path><path d=\"M50 62 L22 50\"></path><path d=\"M50 62 L78 50\"></path><path d=\"M50 80 L32 70\"></path><path d=\"M50 80 L68 70\"></path></g></svg>",
        "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 132\" style=\"overflow:visible;\"><path d=\"M50 6 C72 26 78 60 50 90 C22 60 28 26 50 6 Z\" fill=\"#cdb994\"></path><g stroke=\"#3d2b1f\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M50 124 L50 14\"></path><path d=\"M50 36 L34 26\"></path><path d=\"M50 36 L66 26\"></path><path d=\"M50 54 L30 42\"></path><path d=\"M50 54 L70 42\"></path><path d=\"M50 72 L36 60\"></path><path d=\"M50 72 L64 60\"></path></g></svg>",
        "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 132\" style=\"overflow:visible;\"><path d=\"M50 6 C55 20 61 26 69 24 C67 31 64 36 68 38 C76 36 84 32 90 28 C86 38 80 48 74 54 C80 56 86 56 92 54 C84 62 74 68 64 72 C67 76 73 78 79 78 C69 84 58 86 50 86 C42 86 31 84 21 78 C27 78 33 76 36 72 C26 68 16 62 8 54 C14 56 20 56 26 54 C20 48 14 38 10 28 C16 32 24 36 32 38 C36 36 33 31 31 24 C39 26 45 20 50 6 Z\" fill=\"#a85a34\"></path><g stroke=\"#3d2b1f\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M50 124 L50 22\"></path><path d=\"M50 58 L26 42\"></path><path d=\"M50 58 L74 42\"></path><path d=\"M50 74 L32 64\"></path><path d=\"M50 74 L68 64\"></path></g></svg>",
        "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\" style=\"overflow:visible;\"><path d=\"M50 10 C74 28 78 62 50 88 C22 62 26 28 50 10 Z\" fill=\"#8aab78\"></path><g stroke=\"#3d2b1f\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M50 92 L50 18\"></path><path d=\"M50 44 L34 34\"></path><path d=\"M50 44 L66 34\"></path><path d=\"M50 64 L36 54\"></path><path d=\"M50 64 L64 54\"></path></g></svg>",
        "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 132\" style=\"overflow:visible;\"><path d=\"M50 6 C58 8 62 16 59 24 C69 20 78 25 77 34 C86 32 92 40 88 48 C96 52 95 62 87 65 C90 74 82 81 73 77 C71 85 61 88 55 82 C55 88 52 94 50 100 C48 94 45 88 45 82 C39 88 29 85 27 77 C18 81 10 74 13 65 C5 62 4 52 12 48 C8 40 14 32 23 34 C22 25 31 20 41 24 C38 16 42 8 50 6 Z\" fill=\"#e8862a\"></path><g stroke=\"#3d2b1f\" stroke-width=\"2.4\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M50 126 L50 18\"></path><path d=\"M50 42 L28 30\"></path><path d=\"M50 42 L72 30\"></path><path d=\"M50 62 L22 50\"></path><path d=\"M50 62 L78 50\"></path><path d=\"M50 80 L32 70\"></path><path d=\"M50 80 L68 70\"></path></g></svg>"
      ];

      function spawnBubble() {
        var b = document.createElement("div");
        var size = 8 + Math.random() * 20;
        b.style.cssText = [
          "position:fixed", "bottom:-30px",
          "left:" + (Math.random() * 100) + "vw",
          "width:" + size + "px", "height:" + size + "px",
          "border-radius:50%",
          "background:radial-gradient(circle at 32% 30%, rgba(255,255,255,.9), rgba(160,230,245,.35) 48%, rgba(120,205,228,.12) 72%)",
          "border:1px solid rgba(255,255,255,.55)",
          "box-shadow:inset 0 0 6px rgba(255,255,255,.5)",
          "pointer-events:none",
          "animation:bubbleRise " + (8 + Math.random() * 5) + "s linear forwards"
        ].join(";");
        layer.appendChild(b);
        setTimeout(function () { b.remove(); }, 14000);
      }

      function spawnLeaf() {
        var el = document.createElement("div");
        var size = 16 + Math.random() * 20;
        var dur = 9 + Math.random() * 6;
        el.innerHTML = LEAF_SVGS[Math.floor(Math.random() * LEAF_SVGS.length)];
        el.style.cssText = [
          "position:fixed", "top:0",
          "left:" + (Math.random() * 100) + "vw",
          "width:" + size + "px", "height:" + (size * 1.16) + "px",
          "opacity:0",
          "--dx:" + (Math.random() * 120 - 60) + "px",
          "--spin:" + (360 + Math.random() * 540) + "deg",
          "filter:drop-shadow(0 2px 4px rgba(120,60,20,.18))",
          "pointer-events:none",
          "animation:leafFall " + dur + "s linear forwards"
        ].join(";");
        var svg = el.firstChild;
        if (svg && svg.style) { svg.style.width = "100%"; svg.style.height = "100%"; svg.style.display = "block"; }
        layer.appendChild(el);
        setTimeout(function () { el.remove(); }, (dur + 1) * 1000);
      }

      var spawn = IS_AUTUMN ? spawnLeaf : spawnBubble;
      if (IS_AUTUMN) { for (var i = 0; i < 4; i++) setTimeout(spawnLeaf, i * 600); }
      setInterval(spawn, IS_AUTUMN ? 1100 : 850);
    })();
  </script>
</body>
</html>
