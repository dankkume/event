<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>단꿈e 사은품 신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, "Noto Sans KR", sans-serif;
      background-color: #ffffff;
      color: #333;
      line-height: 1.4;
      overflow-x: hidden;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* ---------------- 배너 영역 ---------------- */
    .banner-wrapper {
      width: 100%;
      padding: 10px 0 4px;
      display: flex;
      justify-content: center;
    }

    /* ✅ 레이어 배너 스택 (수정됨: overflow 추가) */
    .banner-stack {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      overflow: hidden; 
      border-radius: 12px;
    }

    /* 배너 공통 */
    .banner-stack img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* base */
    .banner-base {
      position: relative;
      z-index: 1;
    }

    /* overlay(나무) (수정됨: 정렬 보정) */
    .banner-tree {
      position: absolute;
      top: -1px;
      left: -1px;
      width: calc(100% + 2px); 
      pointer-events: none;
      user-select: none;
      will-change: transform;
      z-index: 2;
    }

    /* 🌿 왼쪽 나무: 흔들림 */
    .tree-left {
      transform-origin: 0% 0%;
      animation: swayLeft 5s ease-in-out infinite;
    }

    /* 🌿 오른쪽 나무: 흔들림 */
    .tree-right {
      transform-origin: 100% 0%;
      animation: swayRight 6.2s ease-in-out infinite;
    }

    /* ✅ 봄바람 느낌: 각도 + 좌우/상하 미세 이동 */
    @keyframes swayLeft {
      0%   { transform: rotate(0deg) translateX(0px) translateY(0px); }
      25%  { transform: rotate(1.8deg) translateX(2px) translateY(1px); }
      50%  { transform: rotate(2.8deg) translateX(3px) translateY(2px); }
      75%  { transform: rotate(1.5deg) translateX(2px) translateY(1px); }
      100% { transform: rotate(0deg) translateX(0px) translateY(0px); }
    }

    @keyframes swayRight {
      0%   { transform: rotate(0deg) translateX(0px) translateY(0px); }
      25%  { transform: rotate(-1.6deg) translateX(-2px) translateY(1px); }
      50%  { transform: rotate(-2.4deg) translateX(-3px) translateY(2px); }
      75%  { transform: rotate(-1.3deg) translateX(-2px) translateY(1px); }
      100% { transform: rotate(0deg) translateX(0px) translateY(0px); }
    }

    @media (max-width: 768px) {
      .banner-stack { max-width: 92%; }
      .tree-left { animation-duration: 5.6s; }
      .tree-right { animation-duration: 6.8s; }
      /* (키프레임 생략 - 이전과 동일) */
    }

    /* ---------------- 본문 영역 ---------------- */
    .content-wrapper {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      text-align: center;
    }

    .info-box {
      background-color: #fffafc;
      border: none;
      border-radius: 18px;
      padding: 24px 20px;
      margin: 24px auto 36px;
      max-width: 760px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      font-size: 1rem;
      line-height: 1.6;
      text-align: center;
    }

    .info-box strong {
      color: #5B40F5;
      font-weight: 800;
    }

    .info-box .warning-text {
      display: block;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px dashed #D8D8D8;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #E64A19;
      font-weight: 500;
    }

    /* ---------------- iframe (폼 영역) ---------------- */
    .iframe-container {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
    }

    .iframe-container iframe {
      width: 100%;
      border: 0;
      display: block;
      min-height: 2000px;
      transition: height 0.25s ease;
    }

    /* ---------------- Bottom Decoration ---------------- */
    .footer-deco {
      width: 100%;
      margin-top: 40px;
    }

    .footer-deco img {
      display: block;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
    }

    /* 🌸 꽃잎 떨어지는 효과 */
    .sakura {
      position: fixed;
      top: -40px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      will-change: transform;
      animation-name: sakuraFall;
      animation-timing-function: linear;
    }

    @keyframes sakuraFall {
      0% { transform: translate3d(0, -40px, 0) rotate(0deg); opacity: 1; }
      100% { transform: translate3d(0, 110vh, 0) rotate(360deg); opacity: 0.8; }
    }
  </style>

  <script>
    window.addEventListener("message", function (event) {
      if (!event.data || event.data.type !== "setHeight") return;
      const iframe = document.getElementById("giftFormFrame");
      if (!iframe) return;
      iframe.style.height = Math.max(event.data.height, 600) + "px";
    });

    window.addEventListener("message", function (event) {
      if (!event.data || event.data.type !== "formSubmitted") return;
      const infoBox = document.querySelector(".info-box");
      if (infoBox) infoBox.style.display = "none";
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    function createSakura() {
      const sakura = document.createElement("div");
      sakura.className = "sakura";
      sakura.innerHTML = "<img src='cherry_blossom.png' alt='' aria-hidden='true' />";
      sakura.style.left = (Math.random() * window.innerWidth) + "px";
      sakura.style.animationDuration = (6 + Math.random() * 4) + "s";
      document.body.appendChild(sakura);
      setTimeout(() => sakura.remove(), 12000);
    }
    setInterval(createSakura, 700);
  </script>
</head>

<body>
  <div class="page-wrapper">
    <header class="banner-wrapper">
      <div class="banner-stack">
        <img src="banner_01.png" class="banner-base" alt="단꿈e 특별 사은품 증정 이벤트" />
        <img src="banner_02.png" class="banner-tree tree-left" alt="" aria-hidden="true" />
        <img src="banner_03.png" class="banner-tree tree-right" alt="" aria-hidden="true" />
      </div>
    </header>

    <main class="content-wrapper">
      <section class="info-box">
        <p>종합 프리패스[12개월 수강권] 결제 고객님께<br><strong>단꿈아이 대모험 시리즈 2종</strong>이 지급될 예정입니다.</p>
        <p>하단 사은품 선택 항목에서<br><strong>수령을 희망하는 2종</strong>을 선택해 주세요.</p>
        <div class="warning-text">
          <p style="font-weight: 700;">필수 확인 사항</p>
          <span>※ 주소지 오기입으로 인한 반송 건은 재발송 되지 않습니다.</span>
        </div>
      </section>

      <div class="iframe-container">
        <iframe
          id="giftFormFrame"
          src="https://script.google.com/macros/s/AKfycbzuw-vJIFvx5y4X5IGygbkRtMwBxEh6l17CKQjOQRw36zSEReamhs5S5hqWNq0L7KBI/exec"
          title="단꿈e 1주년 사은품 신청 폼">
        </iframe>
      </div>

      <footer class="footer-deco">
        <img src="banner-02.png" alt="" />
      </footer>
    </main>
  </div>
</body>
</html>
